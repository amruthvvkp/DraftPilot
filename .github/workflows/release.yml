name: Release

# Push a tag like v0.2.0 (matching both packages' versions) to publish:
#   - draftpilot and draftpilot-mcp to PyPI (trusted publishing; configure both projects on PyPI
#     with this repository, workflow `release.yml` and environment `pypi`),
#   - ghcr.io/amruthvvkp/draftpilot:<version> and :latest (linux/amd64 + linux/arm64),
#   - a GitHub Release with the wheels, sdists and the Compose files.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build wheels and sdists
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Check the tag matches both package versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for file in pyproject.toml packages/draftpilot-mcp/pyproject.toml; do
            version=$(sed -n 's/^version = "\(.*\)"/\1/p' "$file" | head -1)
            test "$version" = "$tag" || { echo "$file is $version, tag is $tag"; exit 1; }
          done
          grep -q "\"draftpilot==$tag\"" packages/draftpilot-mcp/pyproject.toml
      - run: scripts/build_release.sh
      - name: Smoke-test the wheels in a clean environment
        run: |
          uv venv /tmp/smoke -p 3.13
          VIRTUAL_ENV=/tmp/smoke uv pip install dist/*.whl
          /tmp/smoke/bin/draftpilot version
          /tmp/smoke/bin/draftpilot-mcp tools > /dev/null
          unzip -l dist/draftpilot-*.whl | grep -q "draftpilot/studio/index.html"
          unzip -l dist/draftpilot-*.whl | grep -q "draftpilot/migrations/env.py"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - run: rm -f dist/requirements.txt
      - uses: pypa/gh-action-pypi-publish@release/v1

  image:
    name: Publish the image to GHCR
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/draftpilot
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: GitHub Release
    needs: [pypi, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes \
            dist/*.whl dist/*.tar.gz compose.yml compose.release.yml .env.example
