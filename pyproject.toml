[project]
name = "draftpilot"
version = "0.1.0"
description = "AI-powered screenplay editor and story development platform"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "MIT"
authors = [{ name = "Amruth Vithala", email = "amruthvvkp@gmail.com" }]
keywords = ["ai", "film", "screenplay", "screenwriting", "storytelling"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: End Users/Desktop",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Video",
  "Topic :: Text Editors",
]
# Everything the studio, worker, MCP server and RAG service need: `pip install draftpilot` runs them all.
dependencies = [
  "alembic>=1.20.0",
  "asyncpg>=0.31.0",
  "fastapi>=0.141.1",
  "fastmcp>=4.0.10",  # the MCP server (in-app agents use it in-process)
  "httpx>=0.28.1",
  "httpx2>=2.13.1",  # MCP SDK 2 client transport
  "logfire[asyncpg,httpx,fastapi,redis,system-metrics]>=5.1.1",
  "psycopg[binary]>=3.3.6",
  "pydantic>=2.13.5",
  "pydantic-ai>=2.51.0",
  "pydantic-ai-slim[openai,temporal,ag-ui]>=2.51.0",  # durable execution (temporalio); AG-UI chat protocol
  "pydantic-monty>=1.0.0",
  "pydantic-settings>=2.15.0",
  "pypdf>=6.19.0",
  "redis>=5.2.0",
  "reportlab>=5.0.1",
  "screenplay-tools>=0.0.10",
  "sqlalchemy[asyncio]>=2.0",  # async sessions need greenlet
  "sqlmodel>=0.0.47",
  "uvicorn[standard]>=0.54.0",
]

[project.urls]
Homepage = "https://github.com/amruthvvkp/DraftPilot"
Issues = "https://github.com/amruthvvkp/DraftPilot/issues"
# Documentation = "https://draftpilot.dev/docs"
Repository = "https://github.com/amruthvvkp/DraftPilot"

[project.scripts]
draftpilot = "draftpilot.cli:main"

[dependency-groups]
dev = [
  "isort>=9.0.1",
  "jupyter>=1.1.1",
  "mypy>=2.3.1",
  "pre-commit>=4.6.2",
  { include-group = "docs" },
  { include-group = "e2e" },
  { include-group = "lint" },
  { include-group = "test" },
]
debugpy = ["debugpy>=1.8.22"]
docs = [
  "mkdocstrings-python>=1.18",
  "zensical>=0.0.65",
]
e2e = ["pytest-playwright>=0.9.0"]
lint = ["interrogate>=1.7.0", "ruff>=0.16.9"]
test = [
  "aiosqlite>=0.21",
  "dirty-equals>=0.11",
  "pyhamcrest>=2.1.0",
  "pytest>=9.1.1",
  "pytest-pretty>=1.3.0",
]

[tool.uv.workspace]
members = ["packages/*"]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.interrogate]
# Every function, method, class, and module needs a (one-line) docstring.
fail-under = 100
ignore-init-method = true
ignore-magic = true
ignore-nested-functions = false
ignore-setters = true
ignore-overloaded-functions = true
exclude = ["src/draftpilot/migrations/versions", "site", "tests", ".venv"]

[tool.logfire]
ignore_no_config = true

[tool.mypy]
python_version = "3.13"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
# Generated Alembic revisions are reviewed by hand, not type-checked.
exclude = ["src/draftpilot/migrations/versions/"]

[tool.pytest.ini_options]
base_url = "http://localhost:9000"
# Tier 0 (deterministic) runs by default; pass `-m lmstudio` for the local-model tier.
addopts = "-m 'not lmstudio and not postgres and not stack'"
markers = [
  "e2e: Playwright browser journeys against the running web stack",
  "lmstudio: needs a local LM Studio server (Tier 1); deselected by default",
  "postgres: needs the local stack's Postgres with pgvector; deselected by default",
  "stack: browser journey against the real running stack (no mocks); deselected by default",
]

[tool.ruff]
target-version = "py313"
extend-exclude = ["src/draftpilot/migrations/versions", "site", "frontend"]

[tool.ruff.lint]
# Domain validation raises ValueError by contract; callers map it to 4xx/422.
ignore = ["TRY004"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency markers are evaluated once by design.
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Query", "fastapi.Header"]
