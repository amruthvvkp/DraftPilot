# Development overlay — debugpy + live source mounts on top of compose.yml.
#
#   docker compose -f compose.yml -f compose.dev.yml up --build
#
# Then attach VS Code: "Remote Attach (ui)" → :5678, "Remote Attach (worker)" → :5679.
# debugpy listens but does NOT wait for a client, so the stack runs with or without the debugger.
# Services use the Dockerfile's `dev` target (the source tree installed editable), and src/ is
# bind-mounted, so edits land live; WEB__RELOAD=true makes the web process reload on src/ changes.

x-dev-build: &dev-build
  context: .
  dockerfile: ./Dockerfile
  target: dev
  args:
    INSTALL_DEBUGPY: "true"

services:
  migrate:
    image: draftpilot-dev
    build: *dev-build
    volumes:
      - ./src:/app/src

  ui:
    image: draftpilot-dev
    build: *dev-build
    volumes:
      - ./src:/app/src
      # Host `npm --prefix frontend run build` output is served live, like src/.
      - ./frontend/dist:/app/frontend/dist
    ports:
      - "${DRAFTPILOT_UI_DEBUGPY_PORT:-5678}:5678"
    environment:
      WEB__RELOAD: "true"
      # The host dist mount may be empty until `npm --prefix frontend run build`.
      WEB__REQUIRE_FRONTEND: "false"
    working_dir: /app
    entrypoint: ["python", "-m", "debugpy", "--listen", "0.0.0.0:5678", "-m", "draftpilot.cli"]
    command: ["serve"]

  worker:
    image: draftpilot-dev
    build: *dev-build
    volumes:
      - ./src:/app/src
    ports:
      - "${DRAFTPILOT_WORKER_DEBUGPY_PORT:-5679}:5678"
    entrypoint: ["python", "-m", "debugpy", "--listen", "0.0.0.0:5678", "-m", "draftpilot.cli"]
    command: ["worker"]

  mcp:
    # Live source for the MCP server too; restart the service after server changes
    # (`docker compose -f compose.yml -f compose.dev.yml restart mcp`).
    image: draftpilot-dev
    build: *dev-build
    volumes:
      - ./src:/app/src

  rag:
    image: draftpilot-dev
    build: *dev-build
    volumes:
      - ./src:/app/src
