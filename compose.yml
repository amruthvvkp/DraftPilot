# DraftPilot stack: web (FastAPI API + React studio), Temporal worker, MCP server, RAG, Postgres, Redis,
# and a Temporal dev server (durable execution; UI at http://localhost:8233).
#
# Telemetry (Logfire → OTLP) is OFF by default. For local traces, logs and metrics run the bundled
# Grafana LGTM as well — `docker compose --profile observability up` (Grafana at http://localhost:3300)
# — and set OTEL__ENABLED=true. Point OTEL__EXPORTER_OTLP_ENDPOINT at any other OTLP collector
# instead if you have one. See .env.example.

x-app-env: &app-env
  POSTGRES__HOST: postgres
  POSTGRES__PORT: "5432"
  POSTGRES__USER: draftpilot
  POSTGRES__PASSWORD: draftpilot
  POSTGRES__DB: draftpilot
  REDIS__HOST: redis
  REDIS__PORT: "6379"
  TEMPORAL__HOST: temporal:7233
  RAG__SERVICE_URL: http://rag:8000
  RAG__AUTH_TOKEN: ${RAG__AUTH_TOKEN:-draftpilot-local-token}
  BACKUP__ROOT: /data/backups
  # Default model provider: LM Studio on the host (host.docker.internal is a trusted model host).
  LLM__PROVIDER: ${LLM__PROVIDER:-lm_studio}
  LLM__BASE_URL: ${LLM__BASE_URL:-http://host.docker.internal:1234/v1}
  LLM__MODEL: ${LLM__MODEL:-auto}
  LLM__ENABLED: ${LLM__ENABLED:-true}
  OTEL__ENABLED: ${OTEL__ENABLED:-false}
  OTEL__EXPORTER_OTLP_ENDPOINT: ${OTEL__EXPORTER_OTLP_ENDPOINT:-http://otel-lgtm:4318}

# Lets containers reach a collector running on the host (works on Linux too).
x-extra-hosts: &extra-hosts
  - "host.docker.internal:host-gateway"

services:
  postgres:
    # postgres:16-alpine + pgvector (see Dockerfile.postgres) for hybrid retrieval.
    image: draftpilot-postgres
    build:
      context: .
      dockerfile: ./Dockerfile.postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: draftpilot
      POSTGRES_PASSWORD: draftpilot
      POSTGRES_DB: draftpilot
    ports:
      - "${DRAFTPILOT_POSTGRES_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U draftpilot"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${DRAFTPILOT_REDIS_PORT:-56379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    image: draftpilot-ui
    build:
      context: .
      dockerfile: ./Dockerfile.ui
    command: ["uv", "run", "alembic", "upgrade", "head"]
    environment:
      <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy

  ui:
    image: draftpilot-ui
    restart: unless-stopped
    build:
      context: .
      dockerfile: ./Dockerfile.ui
    ports:
      - "${DRAFTPILOT_UI_PORT:-9000}:8000"
    command: ["uv", "run", "python", "-m", "draftpilot.api"]
    environment:
      <<: *app-env
      # Empty = open API (the UI logs a warning because :9000 is published). Set for any shared use.
      API__TOKEN: ${API__TOKEN:-}
    extra_hosts: *extra-hosts
    volumes:
      - backup_data:/data/backups
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      temporal:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 12

  e2e:
    profiles: [test]
    build:
      context: .
      dockerfile: ./Dockerfile.e2e
    command: ["pytest", "-q", "tests/e2e", "--browser", "chromium", "--base-url", "http://ui:8000"]
    depends_on:
      ui:
        condition: service_healthy

  worker:
    image: draftpilot-worker
    restart: unless-stopped
    build:
      context: .
      dockerfile: ./Dockerfile.worker
    environment:
      <<: *app-env
    extra_hosts: *extra-hosts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      temporal:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  mcp:
    image: draftpilot-mcp
    restart: unless-stopped
    build:
      context: .
      dockerfile: ./Dockerfile.mcp
    ports:
      - "${DRAFTPILOT_MCP_PORT:-9001}:8000"
    command:
      [
        "uv",
        "run",
        "fastmcp",
        "run",
        "src/draftpilot/mcp/server.py:mcp",
        "--transport",
        "http",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
      ]
    environment:
      <<: *app-env
      MCP__AUTH_TOKEN: ${MCP__AUTH_TOKEN:-draftpilot-local-token}
      MCP__ADMIN_TOKEN: ${MCP__ADMIN_TOKEN:-draftpilot-local-admin-token}
      MCP__STDIO_CLIENT_ID: ${MCP__STDIO_CLIENT_ID:-mcp-stdio}
    extra_hosts: *extra-hosts
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 12

  rag:
    image: draftpilot-rag
    restart: unless-stopped
    build:
      context: .
      dockerfile: ./Dockerfile.rag
    ports:
      - "${DRAFTPILOT_RAG_PORT:-9010}:8000"
    environment:
      RAG__AUTH_TOKEN: ${RAG__AUTH_TOKEN:-draftpilot-local-token}
      # Hybrid store in Postgres (pgvector HNSW + tsvector GIN, schema "rag").
      RAG__BACKEND: ${RAG__BACKEND:-postgres}
      RAG__DATABASE_URL: ${RAG__DATABASE_URL:-postgresql://draftpilot:draftpilot@postgres:5432/draftpilot}
      RAG__DATABASE_PATH: /data/draftpilot-rag.sqlite3
      # Embeddings from LM Studio on the host; retrieval falls back to full-text if it is down.
      RAG__EMBEDDING_PROVIDER: ${RAG__EMBEDDING_PROVIDER:-lm_studio}
      RAG__EMBEDDING_BASE_URL: ${RAG__EMBEDDING_BASE_URL:-http://host.docker.internal:1234/v1}
      RAG__EMBEDDING_MODEL: ${RAG__EMBEDDING_MODEL:-text-embedding-nomic-embed-text-v1.5}
      RAG__EMBEDDING_DIMENSIONS: ${RAG__EMBEDDING_DIMENSIONS:-768}
      OTEL__ENABLED: "false"
    extra_hosts: *extra-hosts
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - rag_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 12

  temporal:
    # Temporal dev server: one process, SQLite on a volume, UI on :8233. Fine for local-first use;
    # point TEMPORAL__HOST at a Temporal cluster (or Temporal Cloud) for anything shared.
    image: temporalio/temporal:1.9.1
    restart: unless-stopped
    command:
      [
        "server", "start-dev",
        "--ip", "0.0.0.0",
        "--db-filename", "/home/temporal/temporal.db",
        "--namespace", "default",
        "--ui-port", "8233",
      ]
    ports:
      - "${DRAFTPILOT_TEMPORAL_PORT:-7233}:7233"
      - "${DRAFTPILOT_TEMPORAL_UI_PORT:-8233}:8233"
    volumes:
      - temporal_data:/home/temporal
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "localhost:7233"]
      interval: 5s
      timeout: 5s
      retries: 20

  otel-lgtm:
    # Opt-in local observability: OTLP collector + Tempo, Loki, Prometheus and Grafana in one image.
    profiles: [observability]
    image: grafana/otel-lgtm:latest
    restart: unless-stopped
    ports:
      - "${DRAFTPILOT_GRAFANA_PORT:-3300}:3000"
      - "${DRAFTPILOT_OTLP_HTTP_PORT:-4318}:4318"
    volumes:
      - lgtm_data:/data

volumes:
  pgdata:
  temporal_data:
  lgtm_data:
  rag_data:
  backup_data:
